<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>

    <style>
        :root {
            color-scheme: light dark;
        }

        ::selection {
            background-color: rgb(34 211 238 / 0.5);
            color: white;
        }

        html {
            scroll-behavior: smooth;
        }

        html, body {
            height: 100%;
        }

        body {
            overflow-y: scroll;
            cursor: none;
            position: relative;
        }

        /* Animated background canvas */
        #universe-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        #universe-canvas.loaded {
            opacity: 1;
        }

        body.bg-white #universe-canvas {
            display: none;
        }

        /* Snake game canvas */
        #snake-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 1;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.85);
        }

        #snake-canvas.loaded {
            opacity: 1;
        }

        /* Custom cursor */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #2dd2dd;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease, opacity 0.15s ease;
            mix-blend-mode: difference;
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(45, 210, 221, 0.5);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.3s ease;
            mix-blend-mode: difference;
        }

        .cursor-hover {
            transform: scale(1.5);
        }

        /* Fade in animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .animate-title {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .animate-text {
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
            opacity: 0;
        }

        .animate-nav {
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
            opacity: 0;
        }

        /* Gradient animation */
        .title-gradient {
            background-image: linear-gradient(to right, #2dd2dd 0%, #9a47f3 25%, #fcb26d 50%, #ff61e6 75%, #2dd2dd 100%);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slide 10s linear infinite;
            transition: transform 0.3s ease;
        }

        @keyframes slide {
            to {
                background-position: 200% center;
            }
        }

        /* Enhanced link styles */
        .social-link {
            position: relative;
            transition: all 0.3s ease;
            display: inline-block;
            cursor: none;
        }

        a {
            cursor: none;
        }

        .social-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(to right, #2dd2dd, #9a47f3);
            transition: width 0.3s ease;
        }

        .social-link:hover::after {
            width: 100%;
        }

        .social-link:hover {
            transform: translateX(10px);
            text-shadow: 0 0 20px rgba(45, 210, 221, 0.3);
        }

        /* Emoji animation */
        .wave {
            display: inline-block;
            animation: wave 1.5s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-15deg); }
        }

        /* Glow effect on hover */
        .glow-on-hover {
            transition: text-shadow 0.6s ease;
        }

        .glow-on-hover:hover {
            text-shadow: 0 0 30px rgba(45, 210, 221, 0.6),
                         0 0 60px rgba(154, 71, 243, 0.4);
        }

        /* Parallax container */
        .parallax-container {
            transition: transform 0.1s ease-out;
        }

        /* Loading animation prevention */
        .preload * {
            animation-duration: 0s !important;
            transition-duration: 0s !important;
        }

        /* Ensure content is above canvas */
        main {
            position: relative;
            z-index: 10;
        }

        /* Shooting star animation */
        @keyframes shootingStar {
            0% {
                transform: translate(0, 0) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: translate(-300px, 300px) rotate(-45deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-white dark:bg-neutral-900 text-slate-800 dark:text-slate-200 preload">
    <!-- Universe animation canvas -->
    <canvas id="universe-canvas"></canvas>
    <!-- Snake game canvas -->
    <canvas id="snake-canvas"></canvas>

    <!-- Custom cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <main class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8">
        <article class="my-auto pb-8 max-w-4xl parallax-container">
            <div class="mb-6 animate-title">
                <h1 class="relative inline-flex flex-col-reverse sm:flex-row mb-3">
                    <div class="relative inline-block text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-bold tracking-tight">
                        <span class="title-gradient glow-on-hover">Savva</span>
                    </div>
                </h1>
            </div>

            <p class="block text-lg sm:text-xl font-medium sm:leading-relaxed text-slate-400 dark:text-slate-400 mb-8 w-full md:w-4/5 animate-text">
                <span class="transition-colors duration-300 hover:text-slate-600 dark:hover:text-slate-200">
                    Hi<span class="wave">👋🏻</span> I'm a Software Engineer
                </span>
            </p>

            <nav class="flex flex-col space-y-3 text-base sm:text-lg animate-nav">
                <a href="https://github.com/savvax" target="_blank"
                   class="social-link text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 inline-block w-fit">
                    GitHub
                </a>
                <a href="https://linkedin.com/in/savvax" target="_blank"
                   class="social-link text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 inline-block w-fit">
                    LinkedIn
                </a>
                <a href="https://t.me/sxvvx" target="_blank"
                   class="social-link text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 inline-block w-fit">
                    Telegram
                </a>
                <a href="https://www.instagram.com/savvax/" target="_blank"
                   class="social-link text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 inline-block w-fit">
                    Instagram
                </a>
                <a href="mailto:savvax@savvax.com" target="_blank"
                   class="social-link text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 inline-block w-fit">
                    Email
                </a>
            </nav>
        </article>
    </main>

    <script>
        // Remove preload class after page loads
        window.addEventListener('load', () => {
            document.body.classList.remove('preload');
        });

        // Custom cursor
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        let mouseX = 0, mouseY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            cursor.style.transform = `translate(${mouseX - 10}px, ${mouseY - 10}px)`;
        });

        // Smooth follower animation
        function animateFollower() {
            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;

            cursorFollower.style.transform = `translate(${followerX - 20}px, ${followerY - 20}px)`;

            requestAnimationFrame(animateFollower);
        }
        animateFollower();

        // Cursor hover effect
        const links = document.querySelectorAll('a, .title-gradient');
        links.forEach(link => {
            link.addEventListener('mouseenter', () => {
                cursor.classList.add('cursor-hover');
                cursorFollower.classList.add('cursor-hover');
            });
            link.addEventListener('mouseleave', () => {
                cursor.classList.remove('cursor-hover');
                cursorFollower.classList.remove('cursor-hover');
            });
        });

        // Parallax effect
        const parallaxContainer = document.querySelector('.parallax-container');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            parallaxContainer.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Mobile detection - disable cursor on touch devices
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            cursor.style.display = 'none';
            cursorFollower.style.display = 'none';
            document.body.style.cursor = 'auto';
        }

        // ==================== UNIVERSE ANIMATION ====================
        const canvas = document.getElementById('universe-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let shootingStars = [];
        let mousePosition = { x: 0, y: 0 };
        let particleCount = 150;

        // Resize canvas
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // Particle class for stars
        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
                this.opacity = Math.random();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * 1000;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.vz = Math.random() * 2 + 1;
                this.radius = Math.random() * 2 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.twinkle = 0;
            }

            update() {
                // 3D movement
                this.z -= this.vz;
                if (this.z <= 0) {
                    this.reset();
                    this.z = 1000;
                }

                // Project 3D to 2D
                const scale = 1000 / (1000 + this.z);
                this.projX = (this.x - width / 2) * scale + width / 2;
                this.projY = (this.y - height / 2) * scale + height / 2;
                this.projRadius = this.radius * scale;

                // Twinkle effect
                this.twinkle += this.twinkleSpeed;
                const twinkleFactor = (Math.sin(this.twinkle) + 1) / 2;
                this.currentOpacity = this.opacity * twinkleFactor;

                // Gentle drift
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // Mouse interaction
                const dx = mousePosition.x - this.projX;
                const dy = mousePosition.y - this.projY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 100) {
                    const angle = Math.atan2(dy, dx);
                    const force = (100 - distance) / 100;
                    this.x -= Math.cos(angle) * force * 2;
                    this.y -= Math.sin(angle) * force * 2;
                }
            }

            draw() {
                if (this.projX < 0 || this.projX > width || this.projY < 0 || this.projY > height) {
                    return;
                }

                ctx.beginPath();
                const gradient = ctx.createRadialGradient(
                    this.projX, this.projY, 0,
                    this.projX, this.projY, this.projRadius * 3
                );

                // Color based on distance (depth)
                const hue = 180 + (this.z / 1000) * 60; // Cyan to purple
                gradient.addColorStop(0, `hsla(${hue}, 80%, 80%, ${this.currentOpacity})`);
                gradient.addColorStop(0.5, `hsla(${hue}, 80%, 60%, ${this.currentOpacity * 0.5})`);
                gradient.addColorStop(1, `hsla(${hue}, 80%, 40%, 0)`);

                ctx.fillStyle = gradient;
                ctx.arc(this.projX, this.projY, this.projRadius * 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Shooting star class
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height / 2;
                this.length = Math.random() * 80 + 20;
                this.speed = Math.random() * 10 + 10;
                this.opacity = 1;
                this.life = 1;
            }

            update() {
                this.x -= this.speed;
                this.y += this.speed;
                this.life -= 0.01;
                this.opacity = this.life;

                if (this.life <= 0) {
                    return false;
                }
                return true;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(-Math.PI / 4);

                const gradient = ctx.createLinearGradient(0, 0, this.length, 0);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(0.5, `rgba(45, 210, 221, ${this.opacity * 0.6})`);
                gradient.addColorStop(1, 'rgba(45, 210, 221, 0)');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(this.length, 0);
                ctx.stroke();

                ctx.restore();
            }
        }

        // Initialize particles
        function initParticles() {
            particles = [];
            particleCount = Math.min(150, Math.floor(width * height / 10000));
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // Draw connections between nearby particles
        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].projX - particles[j].projX;
                    const dy = particles[i].projY - particles[j].projY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        const opacity = (1 - distance / 120) * 0.15;
                        ctx.strokeStyle = `rgba(45, 210, 221, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].projX, particles[i].projY);
                        ctx.lineTo(particles[j].projX, particles[j].projY);
                        ctx.stroke();
                    }
                }
            }
        }

        // Create shooting stars randomly
        function createShootingStar() {
            if (Math.random() < 0.02 && shootingStars.length < 3) {
                shootingStars.push(new ShootingStar());
            }
        }

        // Animation loop
        function animate() {
            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(23, 23, 23, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Update and draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Draw connections
            drawConnections();

            // Update and draw shooting stars
            createShootingStar();
            shootingStars = shootingStars.filter(star => {
                const alive = star.update();
                if (alive) star.draw();
                return alive;
            });

            requestAnimationFrame(animate);
        }

        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mousePosition.x = e.clientX;
            mousePosition.y = e.clientY;
        });

        // Initialize and start animation
        resizeCanvas();
        initParticles();

        // Show canvas after initialization
        setTimeout(() => {
            canvas.classList.add('loaded');
        }, 100);

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            initParticles();
        });

        // ==================== SNAKE GAME ====================
        console.log('Snake game initializing...');
        const snakeCanvas = document.getElementById('snake-canvas');
        const snakeCtx = snakeCanvas.getContext('2d');
        let snakeWidth, snakeHeight;
        let gridSize = 50;
        let snakeBody = [];
        let food = null;
        let shouldGrow = false;
        let mouseGridX = 0;
        let mouseGridY = 0;
        let lastHeadX = 0;
        let lastHeadY = 0;

        // Colors - EXTREMELY BRIGHT
        const snakeHeadColor = 'rgba(45, 210, 221, 1)';
        const snakeBodyDecay = 0.96;
        const foodColor = 'rgba(252, 178, 109, 1)';
        const gridColor = 'rgba(0, 255, 255, 1)'; // Pure cyan - maximum visibility

        // Resize snake canvas
        function resizeSnakeCanvas() {
            snakeWidth = snakeCanvas.width = window.innerWidth;
            snakeHeight = snakeCanvas.height = window.innerHeight;
        }

        // Get grid position from mouse
        function getGridPosition(x, y) {
            return {
                x: Math.floor(x / gridSize),
                y: Math.floor(y / gridSize)
            };
        }

        // Draw grid (MAXIMUM visibility)
        function drawGrid() {
            snakeCtx.strokeStyle = gridColor;
            snakeCtx.lineWidth = 3;

            for (let x = 0; x < snakeWidth; x += gridSize) {
                snakeCtx.beginPath();
                snakeCtx.moveTo(x, 0);
                snakeCtx.lineTo(x, snakeHeight);
                snakeCtx.stroke();
            }

            for (let y = 0; y < snakeHeight; y += gridSize) {
                snakeCtx.beginPath();
                snakeCtx.moveTo(0, y);
                snakeCtx.lineTo(snakeWidth, y);
                snakeCtx.stroke();
            }
        }

        // Create food at random position
        function createFood() {
            const maxX = Math.floor(snakeWidth / gridSize);
            const maxY = Math.floor(snakeHeight / gridSize);

            food = {
                x: Math.floor(Math.random() * maxX),
                y: Math.floor(Math.random() * maxY)
            };
        }

        // Check if position matches food
        function checkFood(x, y) {
            if (food && x === food.x && y === food.y) {
                shouldGrow = true;
                createFood();
                return true;
            }
            return false;
        }

        // Update snake body
        function updateSnake() {
            const gridPos = getGridPosition(mousePosition.x, mousePosition.y);
            mouseGridX = gridPos.x;
            mouseGridY = gridPos.y;

            // Only add new segment if head moved to new grid position
            if (mouseGridX !== lastHeadX || mouseGridY !== lastHeadY) {
                // Check if ate food
                checkFood(mouseGridX, mouseGridY);

                // Add new head
                snakeBody.unshift({
                    x: mouseGridX,
                    y: mouseGridY,
                    opacity: 1
                });

                // Remove tail if not growing
                if (!shouldGrow && snakeBody.length > 50) {
                    snakeBody.pop();
                } else if (shouldGrow) {
                    shouldGrow = false;
                }

                lastHeadX = mouseGridX;
                lastHeadY = mouseGridY;
            }

            // Update opacity for fade effect
            for (let i = 0; i < snakeBody.length; i++) {
                if (i > 0) {
                    snakeBody[i].opacity *= snakeBodyDecay;
                }
            }

            // Remove segments with very low opacity
            snakeBody = snakeBody.filter(segment => segment.opacity > 0.01);
        }

        // Draw snake
        function drawSnake() {
            for (let i = snakeBody.length - 1; i >= 0; i--) {
                const segment = snakeBody[i];
                const alpha = segment.opacity;

                if (i === 0) {
                    // Head - very bright cyan
                    snakeCtx.fillStyle = `rgba(45, 210, 221, ${alpha})`;
                    snakeCtx.shadowBlur = 30;
                    snakeCtx.shadowColor = 'rgba(45, 210, 221, 1)';
                } else {
                    // Body - gradient from cyan to purple
                    const hue = 180 + (i / snakeBody.length) * 60;
                    snakeCtx.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
                    snakeCtx.shadowBlur = 20;
                    snakeCtx.shadowColor = `hsla(${hue}, 100%, 60%, 0.8)`;
                }

                // Draw filled rectangle with glow (full size)
                snakeCtx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                // Reset shadow
                snakeCtx.shadowBlur = 0;
            }
        }

        // Draw food
        function drawFood() {
            if (!food) return;

            // Pulsing effect
            const pulse = Math.sin(Date.now() / 300) * 0.2 + 0.8;

            snakeCtx.fillStyle = `rgba(252, 178, 109, ${pulse})`;
            snakeCtx.shadowBlur = 35;
            snakeCtx.shadowColor = 'rgba(252, 178, 109, 1)';

            snakeCtx.fillRect(
                food.x * gridSize + 1,
                food.y * gridSize + 1,
                gridSize - 2,
                gridSize - 2
            );

            // Reset shadow
            snakeCtx.shadowBlur = 0;
        }

        // Snake animation loop
        function animateSnake() {
            // Fill with SOLID black background to make snake EXTREMELY visible
            snakeCtx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            snakeCtx.fillRect(0, 0, snakeWidth, snakeHeight);

            // Draw grid
            drawGrid();

            // Update and draw snake
            updateSnake();
            drawSnake();

            // Draw food
            drawFood();

            requestAnimationFrame(animateSnake);
        }

        // Initialize snake game
        console.log('Resizing snake canvas...');
        resizeSnakeCanvas();
        console.log('Canvas size:', snakeWidth, 'x', snakeHeight);

        console.log('Creating food...');
        createFood();
        console.log('Food position:', food);

        // Show snake canvas after initialization
        setTimeout(() => {
            snakeCanvas.classList.add('loaded');
            console.log('Snake canvas loaded');
        }, 100);

        console.log('Starting snake animation...');
        animateSnake();

        // Handle snake canvas resize
        window.addEventListener('resize', () => {
            resizeSnakeCanvas();
            createFood();
        });
    </script>
</body>
</html>
